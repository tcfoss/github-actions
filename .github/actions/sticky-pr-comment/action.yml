name: Sticky PR Comment
description: Adds or updates a marker-delimited block in the current pull request's description.
inputs:
  marker:
    description: 'HTML comment marker delimiting the block, e.g. "<!-- coverage-summary -->"'
    required: true
  content-file:
    description: 'Path to a file whose contents are placed between the markers'
    required: true
runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      env:
        CONTENT_FILE: ${{ inputs.content-file }}
        MARKER: ${{ inputs.marker }}
      with:
        script: |
          const fs = require('fs');
          const marker = process.env.MARKER;

          const contentFile = process.env.CONTENT_FILE ?? '';
          if (contentFile === '') {
            core.info('No content file specified.');
            return;
          }

          let content = '';
          if (fs.existsSync(contentFile)) {
            content = fs.readFileSync(contentFile, 'utf8');
          }
          else {
            core.info(`Content file "${contentFile}" not found.`);
          }

          if (content.trim().length === 0) {
            core.info('Content is empty. Marker will be removed if present.');
          }

          const escapedMarker = marker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          const body = pr.body ?? '';
          const markerPattern = new RegExp(`${escapedMarker}[\\s\\S]*?${escapedMarker}`);

          let updated = body;
          if (content.trim().length === 0) {
            updated = body.replace(markerPattern, '').trim();
          }
          else if (body.includes(marker)) {
            updated = body.replace(markerPattern, `${marker}\n${content}\n${marker}`);
          }
          else {
            updated = `${body}\n\n${marker}\n${content}\n${marker}`.trimStart();
          }

          core.debug(`Updating pull request body:\n${updated}`);

          if (updated === body) {
            core.info('No changes to the pull request body.');
            return;
          }

          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            body: updated,
          });
