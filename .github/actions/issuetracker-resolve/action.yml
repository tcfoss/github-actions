name: IssueTracker Resolve Release
description: Marks a release as resolved through the IssueTracker API.
inputs:
  api-url:
    description: 'Base API URL including the project stub, e.g. https://host-url/api/project-stub'
    required: true
  version:
    description: 'Version of the release to resolve'
    required: true
  token:
    description: 'API token for authenticating with the IssueTracker API'
    required: true
  status:
    description: 'Used as the status query param on resolve'
    required: false
  work-item-status:
    description: 'Status to set on the work items when resolving the release'
    required: false
  release-url:
    description: 'Link to a public-facing release page'
    required: false
  work-item-base-url:
    description: 'Used to construct links to individual work items'
    required: false
outputs:
  is-valid:
    description: Whether the release was resolved successfully.
    value: ${{ steps.call.outputs.is_valid }}
  failed-work-items:
    description: JSON array of work items that blocked resolution, including unfinished task counts.
    value: ${{ steps.call.outputs.failed_work_items }}
  summary-file:
    description: Path to a Markdown summary when release resolution fails validation.
    value: ${{ steps.call.outputs.summary_file }}

runs:
  using: composite
  steps:
    - id: call
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.token }}
        RELEASE_URL: ${{ inputs.release-url }}
        STATUS: ${{ inputs.status }}
        WORK_ITEM_BASE_URL: ${{ inputs.work-item-base-url }}
        WORK_ITEM_STATUS: ${{ inputs.work-item-status }}
      run: |
        set -euo pipefail

        base="$API_URL/releases/$VERSION"
        auth=(-H "Authorization: Bearer $TOKEN")

        query=""
        sep="?"
        if [[ -n "$STATUS" ]]; then
          status=$(jq -nr --arg value "$STATUS" '$value | @uri')
          query="$query$sep""status=$status"
          sep="&"
        fi
        if [[ -n "$WORK_ITEM_STATUS" ]]; then
          work_item_status=$(jq -nr --arg value "$WORK_ITEM_STATUS" '$value | @uri')
          query="$query$sep""workItemStatus=$work_item_status"
          sep="&"
        fi
        if [[ -n "$RELEASE_URL" ]]; then
          release_url=$(jq -nr --arg value "$RELEASE_URL" '$value | @uri')
          query="$query$sep""releaseUrl=$release_url"
          sep="&"
        fi
        if [[ -n "$WORK_ITEM_BASE_URL" ]]; then
          work_item_base_url=$(jq -nr --arg value "$WORK_ITEM_BASE_URL" '$value | @uri')
          query="$query$sep""baseUrl=$work_item_base_url"
          sep="&"
        fi

        http=$(curl -sS -X POST "${auth[@]}" -H "Accept: application/json" \
          -o release-resolution.json -w '%{http_code}' "$base/resolve$query")
        if [[ "$http" == "204" || "$http" == "200" ]]; then
          echo "is_valid=true" >> "$GITHUB_OUTPUT"
          echo "failed_work_items=[]" >> "$GITHUB_OUTPUT"
          echo "summary_file=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "is_valid=false" >> "$GITHUB_OUTPUT"
        # Release resolution returns 400 for validation failures; also accept 422.
        if [[ "$http" != "400" && "$http" != "422" ]]; then
          echo "::error::IssueTracker release resolution request failed with HTTP $http"
          cat release-resolution.json
          exit 1
        fi
        if ! jq -e '.' release-resolution.json > /dev/null; then
          echo "::error::IssueTracker release resolution returned invalid JSON"
          cat release-resolution.json
          exit 1
        fi

        failed_work_items=$(jq -c '(.validationSummary // .) | .failedWorkItems // []' release-resolution.json)
        echo "failed_work_items=$failed_work_items" >> "$GITHUB_OUTPUT"
        echo "summary_file=release-resolution.md" >> "$GITHUB_OUTPUT"
        jq -r '
          def text: tostring | gsub("\\r"; "") | gsub("\\n"; " ");
          (.validationSummary // .) |
          "## Release resolution failed\n",
          (if .releaseNotActive then "- The release is not active." else empty end),
          (if .hasNoWorkItems then "- The release has no work items." else empty end),
          (if ((.statusError // "") | length) > 0 then "- Status error: " + (.statusError | text) else empty end),
          (if ((.workItemStatusError // "") | length) > 0 then "- Work item status error: " + (.workItemStatusError | text) else empty end),
          ((.failedWorkItems // [])[]? |
            "- #\(.workItemId) \(.title | text)\n  - Not resolved: \(.notResolved)\n  - Missing release note: \(.missingReleaseNote)\n  - Unfinished tasks: \(.unfinishedTaskCount // 0)"),
          ((.errors // [])[]? | "- " + (.errorMessage | text))
        ' release-resolution.json > release-resolution.md
        cat release-resolution.md >> "$GITHUB_STEP_SUMMARY"
        echo "::error::One or more release validation requirements were not met"
        exit 1
