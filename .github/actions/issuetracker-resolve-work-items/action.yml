name: IssueTracker Resolve Work Items
description: Resolves work items through the IssueTracker API.
inputs:
  api-url:
    description: 'Base API URL including the project stub, e.g. https://host-url/api/project-stub'
    required: true
  work-item-ids:
    description: 'JSON array of work item IDs, e.g. [123,456]'
    required: true
  token:
    required: true
  target-status:
    description: 'Status to assign to the work items'
    required: false
outputs:
  is-valid:
    value: ${{ steps.call.outputs.is_valid }}
  work-items:
    description: JSON array containing each work item's resolution result.
    value: ${{ steps.call.outputs.work_items }}
  target-status-error:
    description: Validation error for the requested target status, if any.
    value: ${{ steps.call.outputs.target_status_error }}
runs:
  using: composite
  steps:
    - id: call
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        WORK_ITEM_IDS: ${{ inputs.work-item-ids }}
        TOKEN: ${{ inputs.token }}
        TARGET_STATUS: ${{ inputs.target-status }}
      run: |
        set -euo pipefail

        if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "number" and (floor == .))' \
          <<< "$WORK_ITEM_IDS" > /dev/null; then
          echo "::error::work-item-ids must be a non-empty JSON array of integers"
          exit 1
        fi

        query=$(jq -r 'map("workItemIds=" + (. | tostring | @uri)) | join("&")' <<< "$WORK_ITEM_IDS")
        if [[ -n "$TARGET_STATUS" ]]; then
          target_status=$(jq -nr --arg value "$TARGET_STATUS" '$value | @uri')
          query="$query&targetStatus=$target_status"
        fi

        auth=(-H "Authorization: Bearer $TOKEN")
        http=$(curl -sS -X POST "${auth[@]}" -H "Accept: application/json" \
          -o work-item-resolution.json -w '%{http_code}' \
          "$API_URL/work-items/resolve?$query")
        # 200 = resolved, 422 = validation failed; anything else is unexpected.
        if [[ "$http" != "200" && "$http" != "422" ]]; then
          echo "::error::IssueTracker work item resolution request failed with HTTP $http"
          cat work-item-resolution.json
          exit 1
        fi

        valid=$(jq -r '.isValid' work-item-resolution.json)
        work_items=$(jq -c '.workItems // []' work-item-resolution.json)
        target_status_error=$(jq -r '.targetStatusError // ""' work-item-resolution.json)
        echo "is_valid=$valid" >> "$GITHUB_OUTPUT"
        echo "work_items=$work_items" >> "$GITHUB_OUTPUT"
        echo "target_status_error=$target_status_error" >> "$GITHUB_OUTPUT"

        if [[ "$valid" != "true" ]]; then
          echo "::error::One or more work items could not be resolved"
          jq -r '.workItems[] | select((.validationErrors | length) > 0) | "- #\(.workItemId) \(.title): \(.validationErrors | join("; "))"' \
            work-item-resolution.json >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi