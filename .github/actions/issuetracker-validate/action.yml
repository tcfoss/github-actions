name: IssueTracker Validate Release
description: Calls the IssueTracker API to validate that a release's work items are resolved.
inputs:
  api-url:
    description: 'Base API URL including the project stub, e.g. https://host-url/api/project-stub'
    required: true
  version:
    description: 'Version of the release to validate'
    required: true
  status:
    description: 'Status to validate the release against'
    required: false
  work-item-status:
    description: 'Status to validate the work items against'
    required: false
  work-items-to-be-resolved:
    description: 'JSON array of IDs of work items that will be resolved between validation and completion (they must be resolved separately from release resolution)'
    required: false
  token:
    description: 'API token for authenticating with the IssueTracker API'
    required: true
outputs:
  is-valid:
    value: ${{ steps.call.outputs.is_valid }}
  failed-work-items:
    description: JSON array of work items that caused validation to fail.
    value: ${{ steps.call.outputs.failed_work_items }}
  release-not-active:
    description: Whether validation failed because the release is not active.
    value: ${{ steps.call.outputs.release_not_active }}
  has-no-work-items:
    description: Whether validation failed because the release has no work items.
    value: ${{ steps.call.outputs.has_no_work_items }}
runs:
  using: composite
  steps:
    - id: call
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.token }}
        STATUS: ${{ inputs.status }}
        WORK_ITEM_STATUS: ${{ inputs.work-item-status }}
        WORK_ITEMS_TO_BE_RESOLVED: ${{ inputs.work-items-to-be-resolved }}
      run: |
        set -euo pipefail

        base="$API_URL/releases/$VERSION"
        auth=(-H "Authorization: Bearer $TOKEN")

        query=""
        sep="?"
        if [[ -n "$STATUS" ]]; then
          status=$(jq -nr --arg value "$STATUS" '$value | @uri')
          query="$query$sep""status=$status"
          sep="&"
        fi

        if [[ -n "$WORK_ITEM_STATUS" ]]; then
          work_item_status=$(jq -nr --arg value "$WORK_ITEM_STATUS" '$value | @uri')
          query="$query$sep""workItemStatus=$work_item_status"
          sep="&"
        fi

        if [[ -n "$WORK_ITEMS_TO_BE_RESOLVED" ]]; then
          work_items_to_be_resolved=$(jq -r 'map("workItemsToBeResolved=" + (. | tostring | @uri)) | join("&")' <<< "$WORK_ITEMS_TO_BE_RESOLVED")
          query="$query$sep$work_items_to_be_resolved"
          sep="&"
        fi

        http=$(curl -sS "${auth[@]}" -H "Accept: application/json" \
          -o validation.json -w '%{http_code}' "$base/validation$query")
        # 200 = valid, 422 = validation failed; anything else is unexpected.
        if [[ "$http" != "200" && "$http" != "422" ]]; then
          echo "::error::IssueTracker validation request failed with HTTP $http"
          cat validation.json
          exit 1
        fi
        valid=$(jq -r '.isValid' validation.json)
        failed_work_items=$(jq -c '.failedWorkItems // []' validation.json)
        release_not_active=$(jq -r '.releaseNotActive // false' validation.json)
        has_no_work_items=$(jq -r '.hasNoWorkItems // false' validation.json)
        echo "is_valid=$valid" >> "$GITHUB_OUTPUT"
        echo "failed_work_items=$failed_work_items" >> "$GITHUB_OUTPUT"
        echo "release_not_active=$release_not_active" >> "$GITHUB_OUTPUT"
        echo "has_no_work_items=$has_no_work_items" >> "$GITHUB_OUTPUT"
        if [[ "$valid" != "true" ]]; then
          if [[ "$release_not_active" == "true" ]]; then
            echo "::error::IssueTracker validation failed because the release is not active"
          fi
          if [[ "$has_no_work_items" == "true" ]]; then
            echo "::error::IssueTracker validation failed because the release has no work items"
          fi
          jq -r '.failedWorkItems[] | "- #\(.workItemId) \(.title)"' validation.json >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
