name: Coverage

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version to install, e.g. 10.0.x'
        type: string
        default: '10.0.x'
      artifact-pattern:
        description: 'Glob pattern of test-result artifacts to download and merge'
        type: string
        default: 'coverage-*'
      upload-to-codecov:
        description: 'Upload merged coverage to Codecov when all tests have run'
        type: boolean
        default: false
      filter-unreachable-coverage:
        description: 'Filter explicitly matched unreachable guards from OpenCover reports before generating coverage'
        type: boolean
        default: false
      unreachable-coverage-regex:
        description: 'Regex matching defensive guard source lines to exclude'
        type: string
        default: 'throw new (System\.)?(Diagnostics\.)?UnreachableException\('
    secrets:
      reportgenerator-license:
        description: 'Optional ReportGenerator PRO license key'
        required: false
      codecov-token:
        description: 'Codecov repository upload token'
        required: false
      unreachable-coverage-filter-token:
        description: 'Optional token for accessing the UnreachableCoverageFilter release'
        required: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Download test results
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ inputs.artifact-pattern }}
          merge-multiple: true
          path: TestResults

      - name: Download coverage filter inputs
        if: inputs.filter-unreachable-coverage
        uses: actions/download-artifact@v7
        with:
          pattern: filter-inputs-*
          path: FilterInputs

      - name: Download latest UnreachableCoverageFilter release
        if: inputs.filter-unreachable-coverage
        env:
          FILTER_RELEASE_TOKEN: ${{ secrets.unreachable-coverage-filter-token }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/tcfoss/unreachable-coverage-filter/releases/latest"
          headers=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          if [[ -n "$FILTER_RELEASE_TOKEN" ]]; then
            headers+=(-H "Authorization: Bearer $FILTER_RELEASE_TOKEN")
          fi
          curl --fail --silent --show-error --location "${headers[@]}" "$api_url" -o release.json
          asset_url="$(jq -er '[.assets[] | select(.name | startswith("unreachable-coverage-filter-linux-x64-") and endswith(".tar.gz"))][0].browser_download_url' release.json)"
          mkdir -p UnreachableCoverageFilter
          curl --fail --silent --show-error --location "${headers[@]}" "$asset_url" -o UnreachableCoverageFilter/release.tar.gz
          tar -xzf UnreachableCoverageFilter/release.tar.gz -C UnreachableCoverageFilter
          test -x UnreachableCoverageFilter/TcfOss.UnreachableCoverageFilter

      - name: Filter unreachable coverage guards
        if: inputs.filter-unreachable-coverage
        env:
          UNREACHABLE_COVERAGE_REGEX: ${{ inputs.unreachable-coverage-regex }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          artifact_root = Path("FilterInputs")
          executable = Path("UnreachableCoverageFilter/TcfOss.UnreachableCoverageFilter").resolve()
          workspace = Path.cwd()
          artifacts = sorted(path for path in artifact_root.iterdir() if path.is_dir())
          if not artifacts:
              raise SystemExit("No filter-input artifacts were downloaded.")

          processed = 0
          for artifact in artifacts:
              reports = sorted(artifact.glob("TestResults/**/*.opencover.*.xml"))
              if not reports:
                  print(f"::warning::No OpenCover reports found in {artifact}; skipping it.")
                  continue

              module_names = set()
              for report in reports:
                  root = ET.parse(report).getroot()
                  if root.tag != "CoverageSession":
                      raise SystemExit(f"Expected OpenCover CoverageSession in {report}")
                  module_names.update(
                      Path((module.text or "").replace("\\", "/")).name
                      for module in root.findall("./Modules/Module/ModulePath")
                      if module.text
                  )

              stage = artifact / "CoverageFilterSymbols"
              if not stage.is_dir():
                  raise SystemExit(f"CoverageFilterSymbols is missing from {artifact}")
              for module_name in sorted(module_names):
                  assembly = stage / module_name
                  pdb = assembly.with_suffix(".pdb")
                  if not assembly.is_file() or not pdb.is_file():
                    raise SystemExit(f"Staged Release DLL/PDB pair is missing for OpenCover module {module_name} in {stage}")

              output = Path("FilteredCoverage") / artifact.name
              command = [
                  str(executable),
                  *(str(path.resolve()) for path in reports),
                  "--output-directory", str(output.resolve()),
                  "--exclude-regex", os.environ["UNREACHABLE_COVERAGE_REGEX"],
                  "--assembly-directory", str(stage.resolve()),
                  "--source-root", str(workspace),
              ]
              subprocess.run(command, check=True)
              processed += 1

          if processed == 0:
              raise SystemExit("Filtering was enabled but no OpenCover reports were processed.")
          PY

      - name: Install reportgenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        env:
          REPORTGENERATOR_LICENSE: ${{ secrets.reportgenerator-license }}
        run: |
          if [[ "${{ inputs.filter-unreachable-coverage }}" == "true" ]]; then
            reports="FilteredCoverage/**/*.opencover.*.xml"
          else
            reports="TestResults/**/*.cobertura.xml"
          fi
          reportgenerator \
            -reports:"$reports" \
            -targetdir:coverage \
            -reporttypes:"Html;TextSummary;MarkdownSummaryGithub;Cobertura"
          cat coverage/Summary.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

      - name: Add coverage summary to PR
        uses: tcfoss/github-actions/.github/actions/sticky-pr-comment@v1
        with:
          marker: '<!-- coverage-summary -->'
          content-file: coverage/SummaryGithub.md

      - name: Upload coverage to Codecov
        if: inputs.upload-to-codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.codecov-token }}
          files: coverage/Cobertura.xml
          disable_search: true
          fail_ci_if_error: false
